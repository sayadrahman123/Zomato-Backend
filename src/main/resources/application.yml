spring:
  profiles:
    active: dev
  application:
    name: zomato-backend
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:zomato_super_secret_jwt_key_change_this_in_production_2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cache:
    restaurant-ttl-minutes: 10
    menu-ttl-minutes: 5
    reviews-ttl-minutes: 5
    cart-ttl-days: 2
